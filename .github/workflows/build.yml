name: Custom Build (CUDA + Vulkan, Windows)

# -----------------------------------------------------------------------------
# What this workflow does:
#   * Daily auto-build (NEW):
#       - Runs on a schedule (see on.schedule below), resolves the newest
#         STABLE release of ggml-org/llama.cpp, and compares it with
#         the tag this workflow built last (state kept in the Actions cache).
#       - What counts as "stable" (verified against the GitHub API on
#         2026-11-08): llama.cpp publishes frequent bXXXXX build tags
#         (b12193, b12202, ...) as PRE-RELEASES, and occasional v<semver>
#         tags (v0.9.0, v1.0.0, v1.1.0) as the stable channel - the /releases
#         /latest endpoint returns exactly those (newest published,
#         non-prerelease, non-draft). The nightly resolves ONLY through that
#         endpoint, with an explicit prerelease/draft rejection as a second
#         guard, so bXXXXX pre-releases are NEVER auto-built. If the GitHub
#         API is unreachable, a scheduled run FAILS LOUDLY instead of
#         guessing a tag via git (git cannot see prerelease flags - the
#         numerically-largest git tag is always a bXXXXX pre-release) and
#         retries automatically the next day.
#       - New tag  -> the CUDA backend is built automatically (nightly
#         defaults: CUDA 12.4, x64 — see the SCHEDULE_* env vars below).
#       - Same tag -> the build jobs are skipped; the run stays green and
#         finishes in about a minute.
#       - State lost?    As a second line of defense the daily run also lists
#         this repo's existing build artifacts: a non-expired artifact for
#         the latest stable tag + the nightly CUDA config also counts as
#         "already built" and is skipped as well.
#       - Failed CUDA build -> the state is not updated, so the next daily
#         run retries the build automatically.
#       - Scheduled workflows run on the default branch only, and GitHub
#         disables them after 60 days without repo activity (any commit
#         re-enables the schedule).
#   * Optimizations (2026-11, aligned with upstream llama.cpp CI practices):
#       - Job timeouts on every job (GitHub best practice; a hung Windows
#         job would otherwise burn up to 6 h of 2x-priced Windows minutes).
#       - The CUDA toolkit is cached with actions/cache (upstream caches its
#         OpenVINO toolkit the same way): skips ~1 GB of NVIDIA redist
#         downloads + unzip + xcopy on every build and masks download flakiness.
#         Restore and save are two separate steps, so the toolkit is saved as
#         soon as it is verified - a build that fails afterwards no longer
#         throws it away (the combined action saves only on job success).
#         The cache key carries a digest of the toolkit recipe that installed
#         it, so a cached toolkit is only ever reused for that same recipe -
#         one saved before a release added a component cannot bring back a
#         missing header (see the 2026-11-26 nvml.h note below).
#       - Removed the dead ccache steps: the default cmake flags pass
#         -DGGML_CCACHE=OFF, so nothing ever went through ccache (the old
#         key also included the tag, which forced a cold cache per tag).
#       - CUDA 12.x builds pin CCCL v3.4.3 like upstream (CTK 12.4 bundles a
#         too-old CUB; the old GGML_CUDA_CUB_3DOT2 flag no longer exists).
#       - Ninja uses N-1 jobs (upstream parity; CUDA compiles are memory
#         hungry on 4-core runners).
#       - cuda_version must be one the windows-setup-cuda action of the ref
#         being built supports (11.7 / 12.4 / 13.1 / 13.5 in current releases,
#         v1.1.0 included); an unsupported value silently skips the install
#         and is caught by the "Verify CUDA toolkit" step, before the build
#         starts.
#       - Only build options llama.cpp defines are passed (checked against
#         the v1.1.0 and master sources on 2026-11-26). CUDA uses
#         -DGGML_CUDA_FA_QUANTS=all: all 64 flash-attention K-V type
#         combinations, with the same result as the deprecated
#         -DGGML_CUDA_FA_ALL_QUANTS=ON, which now only prints a CMake warning.
#         -DGGML_VULKAN_FA_ALL_QUANTS and -DGGML_VULKAN_PERF were never
#         llama.cpp options; CMake ignored them. The Vulkan backend has no
#         such switch at all - it always compiles every flash-attention shader.
#       - The Vulkan SDK is pinned to the version upstream's own Windows
#         Vulkan jobs build with (1.4.357.0), like every other build
#         dependency here. The step used to resolve LunarG's newest SDK at
#         run time, i.e. a version llama.cpp's CI had never compiled.
#       - persist-credentials: false on both checkouts: nothing pushes, so
#         the job's GITHUB_TOKEN is not left in the clone's .git/config.
#   * Supply-chain hardening - infrastructure actions are SHA-pinned; the
#     build recipe travels with the source it builds:
#       - GitHub-owned actions (checkout, cache, upload-artifact): referenced
#         by an immutable 40-hex commit SHA, never by a movable tag (@v6) or
#         branch (@master).
#       - llama.cpp windows-setup-cuda (installs the CUDA toolkit): taken
#         from the llama.cpp ref being BUILT through the local reference
#             uses: ./.github/actions/windows-setup-cuda
#         i.e. the copy inside the checked-out source tree - the exact
#         recipe upstream's own release workflow runs for that release. It
#         is deliberately NOT frozen to a fixed commit:
#           The installer and the source have to change together. On
#           2026-11-26 llama.cpp v1.1.0 added `#include <nvml.h>` to the CUDA
#           backend and, in the same release, a `cuda_nvml_dev` package to
#           this action. This workflow was running a copy vendored from
#           master 2026-11-08 (the sources of v0.9.0 and v1.0.0 contain no
#           nvml.h include, so it never mattered before), which lacked that
#           package - the build stopped at step 58 of 785 with "fatal error
#           C1083: Cannot open include file: 'nvml.h'" in ggml-cuda.cu. Any
#           frozen copy breaks the same way on the next release that changes
#           the component list; the ref's own copy cannot.
#         Why this is not a pinning hole: the action is part of the very
#         llama.cpp source tree whose build system CMake already executes
#         and whose binaries you run afterwards. It carries the trust of the
#         release being built and adds none on top. SHA pins protect against
#         a THIRD-PARTY action repository being retargeted; they do not (and
#         cannot) pin the llama.cpp source this workflow builds on purpose.
#         Being a local action, it needs no Actions allow-list entry either.
#         Why: a tag or branch is just a movable pointer. The maintainer - or
#         an attacker who compromises the action's repo - can retarget it, and
#         your very next run then silently executes different code with your
#         GITHUB_TOKEN and secrets (this actually happened in the March 2025
#         tj-actions/changed-files incident: all version tags were rewritten
#         to a commit that dumped runner memory, secrets included, into public
#         CI logs; only SHA-pinned repos were unaffected). A commit SHA, by
#         contrast, addresses content, not a pointer: the code you audited is
#         the code that runs - forever, until you change it.
#         The "# vX.Y.Z" comment after each SHA is ignored by GitHub. It is a
#         human-readable version note, and Dependabot rewrites it when it
#         bumps the pin.
#         How to update a pinned action (two options):
#           1. Dependabot (recommended): copy the delivered dependabot.yml to
#              .github/dependabot.yml in your repo. Every week it opens PRs
#              like "Bump actions/checkout from d23441a to <new sha>" that
#              swap the SHA + version comment. Merge after a green run - now
#              every action update is a reviewed change, not a silent drift.
#           2. Manually, e.g. for actions/checkout:
#                git ls-remote --tags https://github.com/actions/checkout.git 'refs/tags/v6*'
#              Copy the 40-hex SHA of the tag you want. Prefer a tag WITHOUT
#              a separate "^{}" line (lightweight tag - the SHA IS the commit);
#              for annotated tags use the SHA from the "refs/tags/X^{}" line
#              (that is the commit the tag peels down to). Replace the old SHA
#              and update the version comment next to it.
#         Special case - the llama.cpp windows-setup-cuda action follows the
#           ref being built (see above), so there is nothing for you - or
#           for Dependabot - to bump. The file
#           .github/actions/windows-setup-cuda/action.yml in THIS repo
#           (verbatim copy from llama.cpp commit
#           a691b2345844ce1b430201fc5fd404ce062e05f2, master 2026-11-08) is
#           only the FALLBACK for refs that predate that action in
#           llama.cpp (the first build tag shipping it is b5310, so it is
#           b5309 and older), invoked as $/.github/actions/windows-setup-cuda.
#           Do not re-vendor it to make a new release build: a release that
#           needs a new toolkit component ships an action that installs it.
#           Dependabot cannot and should not touch it (it is a file in this
#           repo, not a uses: pin; also excluded in dependabot.yml).
#   * Repo prerequisite (Settings -> Actions -> General -> Actions permissions):
#       If this repository uses "Allow <owner>, and select non-<owner>, actions
#       and reusable workflows" (instead of "Allow all actions"), the allow
#       list must cover every EXTERNAL `uses:` above, or jobs die at the first
#       blocked step with an "action not in the allow list" failure:
#         - actions/checkout, actions/cache (+restore/save), actions/upload-artifact
#           -> tick "Allow actions created by GitHub" (covers the whole
#              `actions` and `github` orgs), or add pattern: actions/*
#         - ./.github/actions/windows-setup-cuda (inside the llama.cpp
#           checkout) and $/.github/actions/windows-setup-cuda (vendored
#           fallback) -> need NO allow-list entry: both are LOCAL actions.
#           GitHub's docs on that setting: "local actions (./ and $/) and
#           reusable workflows are allowed" (Managing GitHub Actions settings
#           for a repository, Actions permissions).
#           (Kept for reference: this step previously used the remote form
#           ggml-org/llama.cpp/.github/actions/windows-setup-cuda@<sha>, which
#           DOES need an allow-list entry - and the exact full-path pattern
#           ggml-org/llama.cpp/.github/actions/windows-setup-cuda@*, because a
#           repo-level ggml-org/llama.cpp@* pattern does NOT match a
#           subdirectory action ref (verified empirically 2026-11-09). If you
#           ever switch back to the remote form, add that pattern; patterns
#           are comma-separated. Inspect what is actually stored with:
#           gh api repos/OWNER/REPO/actions/permissions/selected-actions.)
#       Notes: @* matches any ref, including SHA pins, so Dependabot's SHA
#       bumps never require touching the allow list. The list gates `uses:`
#       resolution ONLY - it never blocks schedule or workflow_dispatch
#       triggers, and it never applied to Dependabot itself (Dependabot is a
#       GitHub service, not an Action; its PRs appear regardless of this
#       setting).
#   * Lets you pick the llama.cpp source (manual runs):
#       - bleeding-edge  : master branch (latest commit)
#       - latest-tag     : automatically resolves the newest release tag at build time
#       - custom-tag     : use the tag/commit you type into `llama_tag`
#       - <tag> (date)   : a pre-populated list of recent releases (refresh periodically)
#   * Lets you pick the backend:
#       - cuda           : CUDA build (x64 or arm64, MMQ + every FA quant combination)
#       - vulkan         : Vulkan build (x64 only, based on the official llama.cpp workflow)
#       - both           : build both backends in parallel
# -----------------------------------------------------------------------------

on:
  # Daily check of ggml-org/llama.cpp for a new stable release; builds the
  # CUDA backend automatically when the release tag changed.
  # GitHub cron is UTC: 03:00 UTC = 06:00 Europe/Moscow. Runs can start a few
  # minutes late under load. Only executes on the default branch.
  schedule:
    - cron: '0 3 * * *'

  workflow_dispatch:
    inputs:
      llama_source:
        description: 'What to build? bleeding-edge = master branch (latest commit); latest-tag = auto-fetch the newest release tag at build time; custom-tag = use the tag/branch/commit you enter in llama_tag below.'
        type: choice
        options:
          - 'bleeding-edge (master, latest commit)'
          - 'latest-tag (auto-fetch newest release at build time)'
          - 'custom-tag (enter tag in llama_tag below)'
        default: 'bleeding-edge (master, latest commit)'
      llama_tag:
        description: 'Used only when llama_source = custom-tag. Any tag, branch or commit SHA from https://github.com/ggml-org/llama.cpp/releases — e.g. b11552, b11500, master, 0a1b2c3d. Browse the releases page to find the tag/date you want, then paste the tag here. Ignored for the other two llama_source modes.'
        required: false
        default: ''
      build_backend:
        description: 'Backend to build. Vulkan is x64-only; CUDA supports x64 and arm64.'
        type: choice
        options:
          - 'cuda'
          - 'vulkan'
          - 'both'
        default: 'cuda'
      cuda_version:
        description: 'CUDA toolkit version (CUDA backend only). Must be a version supported by the windows-setup-cuda action shipped with the llama.cpp ref being built (11.7 / 12.4 / 13.1 / 13.5 in current releases) - an unsupported value silently skips the toolkit install and fails the "Verify CUDA toolkit" step.'
        type: choice
        options: ['12.4', '13.1', '13.5']
        default: '12.4'
      arch:
        description: 'Target architecture (CUDA only; Vulkan always builds x64)'
        type: choice
        options: ['x64', 'arm64']
        default: 'x64'
      cuda_cmake_flags:
        description: 'Extra CMake flags for CUDA build (appended last = override built-ins). -DGGML_CUDA_FA_QUANTS=all compiles all 64 flash-attention K-V type combinations (the deprecated -DGGML_CUDA_FA_ALL_QUANTS=ON does the same and only adds a CMake warning).'
        required: false
        default: '-DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75 -DGGML_CUDA_FA_QUANTS=all -DGGML_CUDA_FORCE_MMQ=ON -DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_CCACHE=OFF -DBUILD_SHARED_LIBS=ON -DLLAMA_CURL=ON -DLLAMA_BUILD_TESTS=OFF'
      vulkan_cmake_flags:
        description: 'CMake flags for Vulkan build. Mirrors cuda_cmake_flags where applicable: -DGGML_CUDA=ON -> -DGGML_VULKAN=ON. -DCMAKE_CUDA_ARCHITECTURES, -DGGML_CUDA_FORCE_MMQ and -DGGML_CUDA_FA_QUANTS=all have no Vulkan analog (SPIR-V is compiled at build time for every GPU; no MMQ kernel; the Vulkan backend always compiles every flash-attention shader, there is no switch). All CPU/build flags (Release, NATIVE=OFF, SSE42/AVX/AVX2/FMA/F16C, CCACHE=OFF, SHARED_LIBS, CURL, NO_TESTS) are identical and included. Vulkan-only extras: explicit VULKAN_DEBUG/VALIDATE=OFF (their defaults) for a lean release build.'
        required: false
        default: '-DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DGGML_VULKAN_DEBUG=OFF -DGGML_VULKAN_VALIDATE=OFF -DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_CCACHE=OFF -DBUILD_SHARED_LIBS=ON -DLLAMA_CURL=ON -DLLAMA_BUILD_TESTS=OFF'
      build_target:
        description: 'Build target (empty = all binaries)'
        required: false
        default: ''

# -----------------------------------------------------------------------------
# Nightly auto-build configuration (used ONLY by the scheduled runs; manual
# workflow_dispatch runs use the input defaults above). The last-built-tag
# state cache key is derived from SCHEDULE_CUDA_VERSION + SCHEDULE_ARCH, so
# changing these makes the nightly run build the new configuration once and
# then dedup against that configuration going forward.
# -----------------------------------------------------------------------------
env:
  SCHEDULE_BUILD_BACKEND: cuda # nightly auto-build is CUDA-only
  SCHEDULE_CUDA_VERSION: '12.4'
  SCHEDULE_ARCH: x64

# The daily dedup saves/restores a tiny state file through the Actions cache,
# which needs the `actions` write permission on repos whose default
# GITHUB_TOKEN permissions are restricted. Nothing else is written.
permissions:
  contents: read
  actions: write

# Don't let a scheduled run and a manual run pile up on the same branch: the
# later run waits for the earlier one to finish; nothing gets cancelled.
concurrency:
  group: custom-build-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # -----------------------------------------------------------------------------
  # Resolve the llama.cpp git ref from the selected source, normalize the
  # build parameters (scheduled runs have no dispatch inputs and fall back to
  # the SCHEDULE_* env defaults), and decide whether the daily auto-build
  # needs to run at all (release tag changed since the last successful build).
  # Outputs:
  #   ref                : the actual git ref to checkout (master, bXXXXX, commit SHA, ...)
  #   label              : a human-readable label for log lines and artifact names
  #   should_build       : 'false' for a scheduled run whose tag was already
  #                        built (state-file match, or an existing non-expired
  #                        build artifact in this repo) -> the build jobs skip
  #   update_state       : 'true' when this run should record its tag as the
  #                        last-built one (scheduled runs, and manual
  #                        latest-tag runs that include the CUDA backend)
  #   build_backend      : cuda / vulkan / both (normalized)
  #   cuda_version       : CUDA toolkit version (normalized)
  #   arch               : x64 / arm64 (normalized)
  #   cuda_cmake_flags   : CUDA CMake flags (normalized)
  #   vulkan_cmake_flags : Vulkan CMake flags (normalized)
  #   build_target       : build target, empty = all binaries
  # -----------------------------------------------------------------------------
  resolve-ref:
    name: Resolve llama.cpp ref
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ref: ${{ steps.parse.outputs.ref }}
      label: ${{ steps.parse.outputs.label }}
      should_build: ${{ steps.parse.outputs.should_build }}
      update_state: ${{ steps.parse.outputs.update_state }}
      build_backend: ${{ steps.parse.outputs.build_backend }}
      cuda_version: ${{ steps.parse.outputs.cuda_version }}
      arch: ${{ steps.parse.outputs.arch }}
      cuda_cmake_flags: ${{ steps.parse.outputs.cuda_cmake_flags }}
      vulkan_cmake_flags: ${{ steps.parse.outputs.vulkan_cmake_flags }}
      build_target: ${{ steps.parse.outputs.build_target }}
    steps:
      - name: Restore last-built-tag state (daily auto-build dedup)
        # Tiny state file remembering which llama.cpp tag was last built with
        # this CUDA configuration. The exact key is never written (saves below
        # append a unique run suffix), so the restore-keys prefix match picks
        # the most recent entry. A cache miss just means "not built yet".
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: llama-build-state
          key: llama-cuda-lastbuilt-v1-${{ env.SCHEDULE_CUDA_VERSION }}-${{ env.SCHEDULE_ARCH }}
          restore-keys: |
            llama-cuda-lastbuilt-v1-${{ env.SCHEDULE_CUDA_VERSION }}-${{ env.SCHEDULE_ARCH }}

      - id: parse
        shell: bash
        env:
          # Used ONLY to list this repo's build artifacts (actions: read)
          # for the "already built?" fallback check.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          event="${GITHUB_EVENT_NAME:-}"

          # Scheduled runs carry no workflow_dispatch inputs: force the
          # "latest stable release" mode. Manual runs use the user's choice.
          if [ "$event" = "schedule" ]; then
            src="latest-tag"
          else
            src="${{ inputs.llama_source }}"
          fi

          latest_tag_mode="no"

          case "$src" in
            bleeding-edge*)
              ref="master"
              label="bleeding-edge"
              ;;
            latest-tag*)
              echo "Fetching latest STABLE release tag from the GitHub API..."
              # llama.cpp release model (verified 2026-11-08): frequent bXXXXX
              # tags are published as PRE-RELEASES; occasional v<semver> tags
              # (v0.9.0, v1.0.0, v1.1.0) are the stable channel. /releases/latest
              # returns only the newest published non-prerelease non-draft
              # release; the python filter below rejects prerelease/draft AGAIN
              # as a second guard (e.g. against an admin manually marking a
              # pre-release as "latest"). bXXXXX tags therefore NEVER resolve
              # through this path.
              # The call is authenticated with the job's GITHUB_TOKEN when set:
              # 5000 req/h instead of ~60 req/h unauthenticated, which makes
              # rate-limit failures effectively impossible on GitHub runners.
              auth_args=()
              if [ -n "${GH_TOKEN:-}" ]; then
                auth_args=(-H "Authorization: Bearer ${GH_TOKEN}")
              fi
              ref=""
              for i in 1 2 3; do
                echo "API attempt $i ..."
                if ref="$(curl -fsSL --retry 2 "${auth_args[@]}" -H 'Accept: application/vnd.github+json' \
                  https://api.github.com/repos/ggml-org/llama.cpp/releases/latest \
                  | python3 -c 'import sys,json; r=json.load(sys.stdin); sys.exit(1) if (r.get("prerelease") or r.get("draft") or not r.get("tag_name")) else print(r["tag_name"])' 2>/dev/null)" \
                   && [ -n "$ref" ]; then
                  break
                fi
                ref=""
                echo "Attempt $i failed (rate limit, transient network error, or the response was a pre-release/draft); retrying in ${API_RETRY_SLEEP:-10}s ..."
                sleep "${API_RETRY_SLEEP:-10}"
              done
              # Fallback ONLY for manual runs. git cannot see GitHub's
              # prerelease/draft flags, so a git-only "latest tag" is a GUESS:
              # prefer stable v<semver> tags, and only take a bXXXXX tag when
              # no v-tag exists at all (bXXXXX are pre-releases). Scheduled
              # runs never guess - they fail loudly and retry the next day,
              # which is the safe direction for "stable releases only".
              if [ -z "$ref" ]; then
                if [ "$event" = "schedule" ]; then
                  echo "::error::GitHub API unavailable on a scheduled run. Refusing to guess the latest stable release via git (prerelease status is invisible to git, and llama.cpp's bXXXXX tags are pre-releases). This run does nothing; the next daily run retries automatically." >&2
                  exit 1
                fi
                echo "::warning::GitHub API unavailable (manual run): resolving the newest tag via git ls-remote WITHOUT prerelease/draft verification. Preferring stable v<semver> tags; bXXXXX tags are pre-releases."
                ref="$(git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp.git \
                  | sed -nE 's#.*refs/tags/(v[0-9]+(\.[0-9]+)*)$#\1#p' \
                  | sort -V | tail -n1)"
                if [ -z "$ref" ]; then
                  ref="$(git ls-remote --tags --refs https://github.com/ggml-org/llama.cpp.git \
                    | sed -nE 's#.*refs/tags/(b[0-9]+)$#\1#p' \
                    | sort -V | tail -n1)"
                fi
              fi
              if [ -z "$ref" ]; then
                echo "::error::Could not resolve the latest llama.cpp release tag (GitHub API and git ls-remote both failed). Re-run the workflow or use bleeding-edge/custom-tag instead." >&2
                exit 1
              fi
              label="latest-tag($ref)"
              latest_tag_mode="yes"
              ;;
            custom-tag*)
              ref="${{ inputs.llama_tag }}"
              if [ -z "$ref" ]; then
                echo "::error::llama_source=custom-tag but llama_tag is empty. Set llama_tag (browse https://github.com/ggml-org/llama.cpp/releases) or pick a different source." >&2
                exit 1
              fi
              label="custom($ref)"
              ;;
            "")
              # inputs.* is empty when the workflow is triggered by push/PR instead of
              # workflow_dispatch: default to the same behavior as bleeding-edge instead
              # of failing and skipping every dependent job.
              echo "::warning::llama_source is empty (non-dispatch trigger or re-run without inputs); defaulting to bleeding-edge (master)."
              ref="master"
              label="bleeding-edge"
              ;;
            *)
              echo "::error::Unknown llama_source value: '$src'. Expected bleeding-edge / latest-tag / custom-tag." >&2
              exit 1
              ;;
          esac

          # ---------------------------------------------------------------------------
          # Effective build parameters.
          # Scheduled runs (and any other non-dispatch trigger) have empty
          # inputs.*, so fall back to the SCHEDULE_* env vars / the same
          # defaults the workflow_dispatch inputs declare. Keep the flag
          # strings in sync with the input defaults at the top of this file.
          # ---------------------------------------------------------------------------
          build_backend="${{ inputs.build_backend }}"
          cuda_version="${{ inputs.cuda_version }}"
          arch="${{ inputs.arch }}"
          cuda_cmake_flags="${{ inputs.cuda_cmake_flags }}"
          vulkan_cmake_flags="${{ inputs.vulkan_cmake_flags }}"
          build_target="${{ inputs.build_target }}"

          if [ "$event" = "schedule" ]; then
            build_backend="$SCHEDULE_BUILD_BACKEND"
            cuda_version="$SCHEDULE_CUDA_VERSION"
            arch="$SCHEDULE_ARCH"
          fi

          if [ -z "$build_backend" ]; then build_backend="cuda"; fi
          if [ -z "$cuda_version" ]; then cuda_version="12.4"; fi
          if [ -z "$arch" ]; then arch="x64"; fi
          if [ -z "$cuda_cmake_flags" ]; then
            cuda_cmake_flags="-DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75 -DGGML_CUDA_FA_QUANTS=all -DGGML_CUDA_FORCE_MMQ=ON -DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_CCACHE=OFF -DBUILD_SHARED_LIBS=ON -DLLAMA_CURL=ON -DLLAMA_BUILD_TESTS=OFF"
          fi
          if [ -z "$vulkan_cmake_flags" ]; then
            vulkan_cmake_flags="-DCMAKE_BUILD_TYPE=Release -DGGML_VULKAN=ON -DGGML_VULKAN_DEBUG=OFF -DGGML_VULKAN_VALIDATE=OFF -DGGML_NATIVE=OFF -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_CCACHE=OFF -DBUILD_SHARED_LIBS=ON -DLLAMA_CURL=ON -DLLAMA_BUILD_TESTS=OFF"
          fi
          # build_target stays empty when unset = build all binaries.

          # ---------------------------------------------------------------------------
          # Daily dedup ("already built -> do not rebuild"): skip the build when
          # the resolved tag was already built, in two ways:
          #   1. State file (restored from the Actions cache above) names the
          #      last tag built with this CUDA configuration.
          #   2. Fallback for lost state (cache evicted / cleared / workflow was
          #      disabled for a while): list this repo's build artifacts and
          #      treat the release as built when a non-expired artifact for
          #      this exact tag + CUDA config exists. Matching also tolerates
          #      artifact-name sanitization by comparing alphanumeric-only
          #      forms of the names.
          # Only scheduled runs dedup; manual runs always build.
          # ---------------------------------------------------------------------------
          should_build="true"
          skip_reason=""
          last=""
          if [ -f llama-build-state/last-built-tag.txt ]; then
            last="$(tr -d '[:space:]' < llama-build-state/last-built-tag.txt)"
          fi

          if [ "$event" = "schedule" ] && [ -n "$last" ] && [ "$last" = "$ref" ]; then
            should_build="false"
            skip_reason="state file: last built tag is already $ref"
          fi

          if [ "$should_build" = "true" ] && [ "$event" = "schedule" ]; then
            expected_artifact="llama-custom-cuda-${cuda_version}-${arch}-latest-tag(${ref})"
            echo "State has no match; checking this repo for an existing artifact: $expected_artifact"
            art_json="$(curl -fsSL --retry 2 \
              -H "Authorization: Bearer ${GH_TOKEN:-}" \
              -H 'Accept: application/vnd.github+json' \
              "${GITHUB_API_URL:-https://api.github.com}/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" 2>/dev/null || true)"
            if [ -n "$art_json" ]; then
              if printf '%s' "$art_json" | python3 -c 'import sys, json; want = sys.argv[1]; norm = lambda s: "".join(c for c in s if c.isalnum()); wn = norm(want); arts = json.load(sys.stdin).get("artifacts", []); sys.exit(0 if any((a.get("name") == want or norm(a.get("name", "")) == wn) and not a.get("expired", False) for a in arts) else 1)' "$expected_artifact" 2>/dev/null; then
                should_build="false"
                skip_reason="existing artifact: $expected_artifact"
              fi
            else
              # Best-effort check: on API failure fall through and build (the
              # safe direction - the worst case is one redundant build).
              echo "::warning::Could not list this repo's artifacts; relying on the state file only."
            fi
          fi

          # Record state only for runs that (attempt to) build the latest
          # stable tag with the CUDA backend: scheduled runs, or manual
          # latest-tag runs whose backend includes CUDA. Manual
          # bleeding-edge / custom-tag runs never touch the state.
          update_state="false"
          if [ "$event" = "schedule" ]; then
            update_state="true"
          elif [ "$latest_tag_mode" = "yes" ]; then
            case "$build_backend" in
              cuda|both) update_state="true" ;;
            esac
          fi

          {
            echo "ref=$ref"
            echo "label=$label"
            echo "should_build=$should_build"
            echo "update_state=$update_state"
            echo "build_backend=$build_backend"
            echo "cuda_version=$cuda_version"
            echo "arch=$arch"
            echo "cuda_cmake_flags=$cuda_cmake_flags"
            echo "vulkan_cmake_flags=$vulkan_cmake_flags"
            echo "build_target=$build_target"
          } >> "$GITHUB_OUTPUT"

          echo "Resolved ref: $ref  (label: $label)"
          echo "Event: $event | backend: $build_backend | CUDA: $cuda_version | arch: $arch"
          echo "Last built tag: ${last:-<none>} -> should_build=$should_build"

          if [ "$should_build" = "false" ]; then
            echo "::notice::Stable llama.cpp release $ref has already been built ($skip_reason) - CUDA build skipped."
          fi

          {
            echo "## llama.cpp custom build"
            echo ""
            echo "- Trigger: $event"
            echo "- Resolved llama.cpp ref: $ref (label: $label)"
            echo "- Backend: $build_backend (CUDA $cuda_version, $arch)"
            echo "- Last built tag: ${last:-<none>}"
            if [ "$should_build" = "true" ]; then
              echo "- Decision: build now (new stable release not built yet)"
            else
              echo "- Decision: skip - $skip_reason"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------------
  # CUDA build job. Same build logic as before; the parameters now come from
  # the normalized resolve-ref outputs so scheduled runs — which have no
  # dispatch inputs — get the same defaults as manual runs.
  # -----------------------------------------------------------------------------
  cuda:
    name: custom-cuda (${{ needs.resolve-ref.outputs.cuda_version }}, ${{ needs.resolve-ref.outputs.arch }}, ${{ needs.resolve-ref.outputs.label }})
    needs: resolve-ref
    if: |
      (needs.resolve-ref.outputs.build_backend == 'cuda' ||
       needs.resolve-ref.outputs.build_backend == 'both') &&
      needs.resolve-ref.outputs.should_build == 'true'
    runs-on: windows-2022
    # Full CUDA build of all binaries takes ~45-75 min on a 4-core runner;
    # 150 min leaves headroom for slow runners without letting a hung job
    # burn the 6 h default of 2x-priced Windows minutes.
    timeout-minutes: 150

    steps:
      - name: Clone llama.cpp (${{ needs.resolve-ref.outputs.label }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ needs.resolve-ref.outputs.ref }}
          # fetch-depth: 0 is required for a correct version string:
          # cmake/build-info.cmake runs `git rev-list --count HEAD`, which
          # returns a bogus small number on shallow clones. It costs ~2-3 min
          # extra on Windows; switch to fetch-depth: 1 if you don't care.
          fetch-depth: 0
          # Nothing in this job pushes to the clone, so do not leave the
          # job's GITHUB_TOKEN in its .git/config (checkout stores it there
          # by default for later git commands).
          persist-credentials: false

      - name: Locate the CUDA toolkit recipe for this ref
        # Decides WHICH copy of llama.cpp's windows-setup-cuda action installs
        # the toolkit, and fingerprints it for the cache key. Rationale in
        # "Supply-chain hardening" in the header: the recipe comes from the ref
        # being built, so it always matches the code it has to support.
        id: cuda-recipe
        shell: bash
        run: |
          set -eu
          recipe=".github/actions/windows-setup-cuda/action.yml"
          if [ -f "$recipe" ]; then
            # This ref ships the installer upstream's own release workflow
            # runs for exactly this source - always the right component list.
            digest="$(sha256sum "$recipe" | cut -c1-12)"
            echo "source=ref" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "Toolkit recipe: shipped with this ref ($recipe, digest $digest)"
          else
            # Refs older than b5310 (the first build tag shipping the
            # action) use the copy vendored in this repo. Its content is
            # fixed, so the fingerprint is a fixed name instead of a hash.
            echo "source=vendored" >> "$GITHUB_OUTPUT"
            echo "digest=vendored-a691b23" >> "$GITHUB_OUTPUT"
            echo "::warning::This llama.cpp ref ships no $recipe - falling back to the vendored copy in this repo (llama.cpp master 2026-11-08)."
          fi
          # Does this ref's CUDA backend include a header only the NVML dev
          # package provides? (Yes from v1.1.0 on.) "Verify CUDA toolkit"
          # fails fast on a toolkit without it.
          if grep -rqE '^\s*#\s*include\s*<nvml\.h>' ggml/src/ggml-cuda; then
            echo "needs_nvml=true" >> "$GITHUB_OUTPUT"
          else
            echo "needs_nvml=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore CUDA toolkit from cache
        # The llama.cpp setup action re-downloads ~1 GB of CUDA redist zips
        # on every run (its internal curl has no --retry). Cache the
        # installed toolkit instead - the same pattern upstream llama.cpp
        # uses for its OpenVINO toolkit in release.yml. Restore and save are
        # two separate steps (like the state file in resolve-ref /
        # save-state): the combined actions/cache action saves in a post-step
        # that runs only when the whole job succeeded, so every failed build
        # threw the freshly installed toolkit away and its retry downloaded
        # it again. "Save CUDA toolkit to cache" below saves right after the
        # verify step. continue-on-error: the cache is an optimization - if
        # the cache service itself misbehaves, the installers below run
        # (no cache-hit output = cache miss) instead of failing the job.
        id: cache-cuda
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ needs.resolve-ref.outputs.cuda_version }}'
          # Exact-match key, no restore-keys. The recipe digest at the end
          # means a cached toolkit is reused ONLY for the recipe that
          # installed it. When a release changes the component list (v1.1.0
          # added the nvml.h package), the digest changes and the toolkit is
          # installed afresh - an older cached toolkit can no longer hide a
          # missing header behind a cache hit.
          key: cuda-toolkit-v2-${{ needs.resolve-ref.outputs.cuda_version }}-${{ needs.resolve-ref.outputs.arch }}-windows-2022-${{ steps.cuda-recipe.outputs.digest }}

      - name: Install Cuda Toolkit (recipe shipped by this llama.cpp ref)
        if: steps.cache-cuda.outputs.cache-hit != 'true' && steps.cuda-recipe.outputs.source == 'ref'
        # LOCAL action out of the checked-out llama.cpp source tree - the copy
        # upstream's own release workflow runs (release.yml:
        # `uses: ./.github/actions/windows-setup-cuda`). A ./ path does NOT
        # mean "the vendored copy in this repo": GitHub's workflow syntax
        # docs state that "the ./ path resolves against the runner's
        # workspace rather than the repository of the running workflow" - and
        # the job workspace here IS the llama.cpp checkout (cloned into the
        # default location by the step above).
        # Not a frozen copy and not a SHA pin on purpose: the installer has to
        # change together with the source (2026-11-26: v1.1.0 added
        # `#include <nvml.h>` plus the cuda_nvml_dev package in this action; a
        # copy vendored from 2026-11-08 lacked it and the build failed with
        # "Cannot open include file: 'nvml.h'"). Full trust discussion in the
        # header ("Supply-chain hardening").
        uses: ./.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ needs.resolve-ref.outputs.cuda_version }}
          cuda_arch: ${{ needs.resolve-ref.outputs.arch }}

      - name: Install Cuda Toolkit (vendored fallback)
        if: steps.cache-cuda.outputs.cache-hit != 'true' && steps.cuda-recipe.outputs.source == 'vendored'
        # Only for refs that predate that action in llama.cpp. $/ is the
        # self-repository reference (GitHub changelog 2026-07-30): it resolves
        # to THIS repo at the running commit, not to the llama.cpp workspace.
        # The vendored file .github/actions/windows-setup-cuda/action.yml must
        # therefore be committed together with this workflow, folder name
        # unchanged.
        uses: $/.github/actions/windows-setup-cuda
        with:
          cuda_version: ${{ needs.resolve-ref.outputs.cuda_version }}
          cuda_arch: ${{ needs.resolve-ref.outputs.arch }}

      - name: Configure CUDA environment (cached toolkit)
        # Restore the PATH / CUDA_PATH setup the install action normally does.
        if: steps.cache-cuda.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ needs.resolve-ref.outputs.cuda_version }}"
          Add-Content $env:GITHUB_ENV "CUDA_PATH=$cuda"
          Add-Content $env:GITHUB_PATH "$cuda\bin"
          Add-Content $env:GITHUB_PATH "$cuda\libnvvp"

      - name: Verify CUDA toolkit
        # Fail loudly, seconds after the install, when this toolkit cannot
        # build this ref - instead of minutes later deep inside a nvcc
        # command line.
        shell: pwsh
        run: |
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ needs.resolve-ref.outputs.cuda_version }}"
          if (-not (Test-Path "$cuda\bin\nvcc.exe")) {
            Write-Error "nvcc.exe not found under $cuda. CUDA ${{ needs.resolve-ref.outputs.cuda_version }} is not installed by the windows-setup-cuda action that ran (recipe source: ${{ steps.cuda-recipe.outputs.source }}) - pick a cuda_version that action supports (see its action.yml), or use a newer ref."
            exit 1
          }
          if ('${{ steps.cuda-recipe.outputs.needs_nvml }}' -eq 'true' -and -not (Test-Path "$cuda\include\nvml.h")) {
            Write-Error "This llama.cpp ref needs nvml.h, but $cuda\include\nvml.h is missing. The toolkit install was incomplete (a download in the setup action most likely failed; it does not retry), or the toolkit came from a cache entry that predates this ref. Re-run the job. If it keeps failing, compare the component list in this ref's .github/actions/windows-setup-cuda/action.yml with what is under $cuda."
            exit 1
          }
          & "$cuda\bin\nvcc.exe" --version | Select-Object -First 4

      - name: Save CUDA toolkit to cache
        # Second half of the restore step above (same path, same key). It
        # sits right after the verify, not at the end of the job, so the
        # toolkit survives a build that fails later: the next run - a retry
        # included - starts from the cache instead of the ~1 GB download.
        # Reached only on a cache miss; the exact key makes a second save of
        # the same toolkit impossible, and the workflow-level concurrency
        # group keeps two runs from writing one key at once.
        # continue-on-error: caching is an optimization - full cache storage
        # (10 GB per repo) must not fail the build itself.
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ needs.resolve-ref.outputs.cuda_version }}'
          key: cuda-toolkit-v2-${{ needs.resolve-ref.outputs.cuda_version }}-${{ needs.resolve-ref.outputs.arch }}-windows-2022-${{ steps.cuda-recipe.outputs.digest }}

      # NOTE: the ggml-org/ccache-action step that used to sit here was dead
      # weight: the default cmake flags pass -DGGML_CCACHE=OFF, so no
      # compilation ever went through ccache and the cache was never
      # populated (and the old key included the tag = cold cache per tag).
      # Removed to save ~1-2 min per run and to stop churning the repo's
      # 10 GB cache budget. To re-enable ccache: drop -DGGML_CCACHE=OFF from
      # the flag defaults and add back:
      #   - name: ccache
      #     uses: ggml-org/ccache-action@v1.2.24
      #     with:
      #       key: custom-cuda-windows-${{ needs.resolve-ref.outputs.cuda_version }}-${{ needs.resolve-ref.outputs.arch }}
      #       evict-old-files: 1d
      # (keep the tag OUT of the key, like upstream does)

      - name: Install Ninja
        run: choco install ninja

      - name: Arm64 toolchain flag
        if: needs.resolve-ref.outputs.arch == 'arm64'
        shell: bash
        run: echo "TOOLCHAIN_FLAG=-DCMAKE_TOOLCHAIN_FILE=cmake/arm64-windows-msvc-cuda.cmake" >> "$GITHUB_ENV"

      - name: CUDA 12.x CCCL pin
        # CTK 12.4 bundles a CCCL/CUB that is too old for current ggml-cuda
        # code; upstream llama.cpp pins CCCL v3.4.3 for its 12.4 release
        # builds (CTK >= 13.5 bundles CCCL >= 3.5 and needs no pin). The old
        # GGML_CUDA_CUB_3DOT2 flag this step used to set no longer exists in
        # llama.cpp and was silently ignored.
        if: startsWith(needs.resolve-ref.outputs.cuda_version, '12')
        shell: bash
        run: echo "CUDA_COMPAT_FLAG=-DGGML_CUDA_CCCL_VERSION=v3.4.3" >> "$GITHUB_ENV"

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" ${{ needs.resolve-ref.outputs.arch == 'x64' && 'x64' || 'amd64_arm64' }}
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            ${{ env.TOOLCHAIN_FLAG }} ^
            ${{ env.CUDA_COMPAT_FLAG }} ^
            ${{ needs.resolve-ref.outputs.cuda_cmake_flags }}
          REM Leave one core for the runner/OS - matches upstream llama.cpp CI
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% ${{ needs.resolve-ref.outputs.build_target && format('--target {0}', needs.resolve-ref.outputs.build_target) || '' }}

      - name: Bundle CUDA runtime DLLs
        shell: pwsh
        run: |
          $cudaBin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v${{ needs.resolve-ref.outputs.cuda_version }}\bin"
          if (Test-Path $cudaBin) {
            Copy-Item "$cudaBin\cudart64_*.dll","$cudaBin\cublas64_*.dll","$cudaBin\cublasLt64_*.dll" -Destination build/bin/Release -ErrorAction SilentlyContinue
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llama-custom-cuda-${{ needs.resolve-ref.outputs.cuda_version }}-${{ needs.resolve-ref.outputs.arch }}-${{ needs.resolve-ref.outputs.label }}
          path: build/bin/Release/
          retention-days: 14

  # -----------------------------------------------------------------------------
  # Vulkan build job (Windows x64 only).
  # Mirrors the official llama.cpp windows-vulkan-x64 workflow:
  #   * LunarG Vulkan SDK installed silently to C:\VulkanSDK\<version>
  #     (version pinned to upstream's, see the "Install Vulkan SDK" step)
  #   * VULKAN_SDK env var + Bin on PATH
  #   * CMake/Ninja Multi-Config + MSVC vcvarsall x64
  #   * -DGGML_VULKAN=ON
  #
  # Flag mapping (CUDA -> Vulkan). Every CUDA flag that has an analog or that
  # is shared across backends is mirrored here:
  #   -DCMAKE_BUILD_TYPE=Release                -> identical
  #   -DGGML_CUDA=ON                            -> -DGGML_VULKAN=ON
  #   -DCMAKE_CUDA_ARCHITECTURES=75              -> (no analog; Vulkan shaders are compiled to SPIR-V at build time and the GPU driver translates them at runtime)
  #   -DGGML_CUDA_FA_QUANTS=all                  -> (no analog; the Vulkan backend always compiles every flash-attention shader, there is no switch)
  #   -DGGML_CUDA_FORCE_MMQ=ON                   -> (no analog; MMQ is a CUDA-only kernel)
  #   -DGGML_NATIVE=OFF                          -> identical
  #   -DGGML_SSE42/AVX/AVX2/FMA/F16C=ON         -> identical (CPU flags apply to all backends)
  #   -DGGML_CCACHE=OFF                          -> identical
  #   -DBUILD_SHARED_LIBS=ON                     -> identical
  #   -DLLAMA_CURL=ON                            -> identical
  #   -DLLAMA_BUILD_TESTS=OFF                    -> identical
  # Vulkan-only extras (their defaults, set explicitly for a lean release build):
  #   -DGGML_VULKAN_DEBUG=OFF
  #   -DGGML_VULKAN_VALIDATE=OFF    (no Vulkan API validation checks compiled into the backend)
  # There is no -DGGML_VULKAN_FA_ALL_QUANTS and no -DGGML_VULKAN_PERF: neither
  # exists in llama.cpp (checked against v1.1.0 and master on 2026-11-26), so
  # CMake silently ignored both while the description claimed a mapping. The
  # Vulkan options llama.cpp does define (ggml/CMakeLists.txt): GGML_VULKAN,
  # GGML_VULKAN_CHECK_RESULTS, GGML_VULKAN_DEBUG, GGML_VULKAN_MEMORY_DEBUG,
  # GGML_VULKAN_SHADER_DEBUG_INFO, GGML_VULKAN_VALIDATE, GGML_VULKAN_RUN_TESTS,
  # GGML_VULKAN_SPIRV_INCLUDE_DIR, GGML_VULKAN_SHADERS_GEN_TOOLCHAIN.
  # Unlike CUDA, the Vulkan backend needs no extra dependency for v1.1.0
  # (nothing like the nvml.h include): it needs the SDK's glslc and MSVC only.
  # Upstream's Windows Vulkan jobs also install LLVM, but only because their
  # clang-cl builds use it; this job compiles with MSVC.
  # No runtime DLLs are bundled: vulkan-1.dll is provided by the GPU driver on
  # the user's machine, just like the official release.
  # NOTE: the daily scheduled run never builds Vulkan (CUDA-only by design);
  # run the workflow manually with build_backend = vulkan / both for that.
  # -----------------------------------------------------------------------------
  vulkan:
    name: custom-vulkan (x64, ${{ needs.resolve-ref.outputs.label }})
    needs: resolve-ref
    if: |
      (needs.resolve-ref.outputs.build_backend == 'vulkan' ||
       needs.resolve-ref.outputs.build_backend == 'both') &&
      needs.resolve-ref.outputs.should_build == 'true'
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Clone llama.cpp (${{ needs.resolve-ref.outputs.label }})
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ needs.resolve-ref.outputs.ref }}
          fetch-depth: 0
          # Nothing in this job pushes to the clone, so do not leave the
          # job's GITHUB_TOKEN in its .git/config (checkout stores it there
          # by default for later git commands).
          persist-credentials: false

      # NOTE: the ccache step that used to sit here was dead weight - the
      # default vulkan_cmake_flags pass -DGGML_CCACHE=OFF, so nothing ever
      # went through ccache. See the note in the CUDA job above for how to
      # re-enable it properly (tagless key + GGML_CCACHE=ON).

      - name: Install Vulkan SDK
        # Pinned, like every other build dependency here: 1.4.357.0 is the
        # VULKAN_VERSION of upstream llama.cpp's Windows Vulkan jobs
        # (build-vulkan.yml and release.yml, at v1.1.0 and on master
        # 2026-11-26), i.e. the SDK the release being built is tested with.
        # This step used to resolve LunarG's newest SDK at run time (that was
        # 1.4.363.1 on 2026-11-26), so a brand-new SDK would have been used
        # here first, before llama.cpp's own CI ever compiled with it.
        # LunarG keeps old installers online, so the pin does not rot. To
        # bump it, copy VULKAN_VERSION from .github/workflows/build-vulkan.yml
        # of the llama.cpp ref being built.
        shell: pwsh
        timeout-minutes: 20
        env:
          VULKAN_VERSION: 1.4.357.0
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          $version = $env:VULKAN_VERSION
          Write-Host "Vulkan SDK version: $version"

          $installer = "$env:RUNNER_TEMP\VulkanSDK-Installer.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          Write-Host "Downloading Vulkan SDK installer from $url ..."
          curl.exe -fSL --retry 3 -o $installer $url
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installer download failed (exit code $LASTEXITCODE)" }

          Write-Host "Installing Vulkan SDK silently to C:\VulkanSDK ..."
          # IMPORTANT: since SDK 1.2.189.1 the LunarG Windows installer is built on the
          # Qt Installer Framework and the old NSIS-style '/S' flag NO LONGER EXISTS.
          # Passing '/S' makes the installer open its GUI wizard; on a headless GitHub
          # runner nobody clicks it and the job hangs forever.
          # Correct silent-install invocation (same as the official llama.cpp workflow):
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK installer exited with code $LASTEXITCODE" }

          # Expected install root: C:\VulkanSDK\<version>
          $sdkPath = "C:\VulkanSDK\$version"
          if (-not (Test-Path $sdkPath)) {
            $sdkRoot = Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction SilentlyContinue |
                       Sort-Object Name -Descending | Select-Object -First 1
            if (-not $sdkRoot) {
              throw "Vulkan SDK install dir not found under C:\VulkanSDK"
            }
            $sdkPath = $sdkRoot.FullName
          }
          Write-Host "Vulkan SDK root: $sdkPath"
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=$sdkPath"
          Add-Content $env:GITHUB_PATH "$sdkPath\Bin"

      - name: Install Ninja
        run: choco install ninja

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          cmake -S . -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_VULKAN=ON ^
            -DLLAMA_BUILD_BORINGSSL=ON ^
            ${{ needs.resolve-ref.outputs.vulkan_cmake_flags }}
          REM Leave one core for the runner/OS - matches upstream llama.cpp CI
          set /A NINJA_JOBS=%NUMBER_OF_PROCESSORS%-1
          cmake --build build --config Release -j %NINJA_JOBS% ${{ needs.resolve-ref.outputs.build_target && format('--target {0}', needs.resolve-ref.outputs.build_target) || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: llama-custom-vulkan-x64-${{ needs.resolve-ref.outputs.label }}
          path: build/bin/Release/
          retention-days: 14

  # -----------------------------------------------------------------------------
  # Record the tag that was just built (state for the daily auto-build).
  # Runs for scheduled runs and for manual latest-tag runs that include the
  # CUDA backend:
  #   * CUDA build succeeded        -> state updated to the new tag, so the
  #     next daily check with the same tag will skip.
  #   * CUDA build skipped (dupe)   -> the same tag is re-written, which also
  #     refreshes the cache entry (caches are evicted after 7 days without
  #     access) and keeps the scheduled run green.
  #   * CUDA build failed           -> this job is skipped, the state is NOT
  #     updated, and the next daily run retries the build automatically.
  # The unique run-id suffix in the save key works around the fact that cache
  # entries are immutable: every save creates a new entry and the prefix
  # restore above always finds the most recent one.
  # -----------------------------------------------------------------------------
  save-state:
    name: Record last-built tag
    needs: [resolve-ref, cuda]
    if: |
      always() &&
      !failure() &&
      !cancelled() &&
      needs.resolve-ref.outputs.update_state == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write state file
        shell: bash
        run: |
          set -eu
          mkdir -p llama-build-state
          printf '%s' '${{ needs.resolve-ref.outputs.ref }}' > llama-build-state/last-built-tag.txt
          echo "Last-built tag recorded: $(cat llama-build-state/last-built-tag.txt)"

      - name: Save state to the Actions cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: llama-build-state
          key: llama-cuda-lastbuilt-v1-${{ needs.resolve-ref.outputs.cuda_version }}-${{ needs.resolve-ref.outputs.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
